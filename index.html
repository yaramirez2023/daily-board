<meta charset="utf-8">
<title>Daily Board — Slide Reading (Construction I &amp; II)</title>
<style>
  :root{
    --bg:#05060d; --panel:#0d0f1e; --panel-2:#12172c; --line:#2a3055; --line-soft:#1a1f38;
    --ink:#eef1ff; --ink-2:#aab3dd; --ink-3:#5f699a;
    --safety:#ff3b5c; --vocab:#35e6ff; --math:#39ff8c; --scenario:#ff3bf0; --draw:#b855ff; --none:#5f699a;
    --courseI:#35e6ff; --courseII:#ff3bf0;
    --accent:var(--vocab);
    --grid:rgba(53,230,255,.05);
    --glow:0 0 18px color-mix(in srgb,var(--accent) 55%,transparent);
    --f-display:Bahnschrift,"Arial Narrow",sans-serif;
    --f-body:"Segoe UI",system-ui,Roboto,Arial,sans-serif;
    --f-data:Consolas,"SF Mono",Menlo,monospace;
  }
  /* Deliberately single-world (site-console / arcade-HUD) — no light variant. This board
     is read from across a classroom, at a distance, often with the lights dimmed; a light
     theme would fight that purpose rather than serve a different one. */
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:var(--f-body); line-height:1.5; overflow:hidden;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                     linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:34px 34px;
    display:flex; flex-direction:column;
  }
  .wrap{width:min(1440px,100%); margin:0 auto; padding:0 clamp(16px,2.6vw,36px);
        height:100vh; display:flex; flex-direction:column; gap:clamp(10px,1.6vh,18px);
        padding-bottom:clamp(10px,1.6vh,18px);}

  /* ---- top rail ---------------------------------------------------- */
  .rail{display:flex; align-items:center; gap:14px; flex-wrap:wrap;
        padding-top:clamp(12px,2vh,20px); flex:none;}
  .brand{font-family:var(--f-display); font-size:clamp(13px,1.3vw,16px); letter-spacing:.16em;
         text-transform:uppercase; color:var(--ink); margin-right:auto;
         display:flex; align-items:center; gap:10px;}
  .brand .sq{width:11px;height:11px;background:var(--accent);
             box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent),var(--glow);}

  .stepper{display:flex; align-items:center; gap:6px}
  .step{appearance:none; cursor:pointer; background:var(--panel);
    border:1.5px solid var(--line); border-radius:8px; width:42px; height:42px;
    color:var(--ink-2); font-size:18px; line-height:1; display:grid; place-items:center;
    transition:border-color .15s,color .15s;}
  .step:hover{border-color:var(--accent); color:var(--accent)}
  .step[disabled]{opacity:.3; cursor:not-allowed}
  .today{appearance:none; cursor:pointer; background:var(--panel);
    border:1.5px solid var(--line); border-radius:8px; height:42px; padding:0 16px;
    font-family:var(--f-display); font-weight:700; font-size:13px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink-2); transition:border-color .15s,color .15s;}
  .today:hover{border-color:var(--accent); color:var(--accent)}
  select.jump{appearance:none; background:var(--panel); border:1.5px solid var(--line);
    border-radius:8px; height:42px; padding:0 34px 0 13px; color:var(--ink-2);
    font-family:var(--f-body); font-size:13.5px; font-weight:700; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
                     linear-gradient(135deg,currentColor 50%,transparent 50%);
    background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat;}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

  /* ---- the board --------------------------------------------------- */
  .board{background:var(--panel); border:1.5px solid var(--line); border-radius:14px;
    overflow:hidden; flex:1; min-height:0;
    display:flex; flex-direction:column;
    box-shadow:0 0 0 1px rgba(255,255,255,.02),0 20px 60px rgba(0,0,0,.55);}
  .band{height:6px; background:var(--accent); flex:none; box-shadow:var(--glow);}

  .head{display:flex; align-items:baseline; gap:clamp(12px,2.2vw,28px);
    flex-wrap:wrap; padding:clamp(14px,2.2vh,24px) clamp(20px,3vw,40px) 0; flex:none;}
  .day{font-family:var(--f-display); font-size:clamp(28px,4.6vw,54px);
    line-height:.96; letter-spacing:-.01em; color:var(--ink); text-transform:uppercase;
    text-wrap:balance; text-shadow:0 0 24px color-mix(in srgb,var(--accent) 35%,transparent);}
  .date{font-family:var(--f-data); font-size:clamp(13px,1.3vw,17px);
    color:var(--ink-3); letter-spacing:.02em; font-variant-numeric:tabular-nums;
    margin-right:auto; white-space:nowrap;}
  .wknum{font-family:var(--f-data); font-size:clamp(12px,1.15vw,14.5px);
    color:var(--bg); background:var(--accent); border-radius:999px;
    padding:6px 15px; letter-spacing:.06em; white-space:nowrap; font-weight:700;
    font-variant-numeric:tabular-nums;}

  .sections{flex:1; min-height:0; overflow-y:auto;
    padding:clamp(10px,1.6vh,16px) clamp(20px,3vw,40px) clamp(16px,2vh,22px);
    display:flex; flex-direction:column; gap:clamp(12px,1.8vh,20px);}

  .sec{border-top:1.5px solid var(--line-soft); padding-top:clamp(10px,1.6vh,16px);}
  .sec:first-child{border-top:0; padding-top:0;}
  .tag{display:inline-flex; align-items:center; gap:9px;
    font-family:var(--f-display); font-size:clamp(11.5px,1.15vw,14px);
    letter-spacing:.16em; text-transform:uppercase; color:var(--tagc,var(--accent));
    margin-bottom:clamp(8px,1.2vh,12px);}
  .tag::before{content:""; width:22px; height:3px; background:var(--tagc,var(--accent)); flex:none;
    box-shadow:0 0 10px var(--tagc,var(--accent));}
  .tag .meta{font-family:var(--f-data); color:var(--ink-3); letter-spacing:0; text-transform:none; font-size:.85em;}

  .prompt{font-size:clamp(21px,3vw,40px); line-height:1.36; color:var(--ink);
    font-weight:600; letter-spacing:-.006em; max-width:34ch; text-wrap:pretty; margin:0;}
  .prompt.reading{font-size:clamp(18px,2.3vw,30px); max-width:44ch; font-weight:500; color:var(--ink-2);}
  .prompt.small{font-size:clamp(17px,2.1vw,28px)}

  .activities{display:flex; flex-direction:column; gap:12px;}
  .act{background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:12px 16px; display:flex; flex-direction:column; gap:4px;}
  .act.friday{border-color:var(--math); box-shadow:0 0 0 1px color-mix(in srgb,var(--math) 30%,transparent);}
  .act .h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .act .h b{font-size:clamp(16px,1.9vw,22px); color:var(--ink); font-weight:700; text-wrap:balance;}
  .act .pts{font-family:var(--f-data); font-size:13px; color:var(--ink-3); white-space:nowrap; margin-left:auto;}
  .act .fribadge{font-family:var(--f-display); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--bg); background:var(--math); border-radius:5px; padding:2px 8px; font-weight:700;}
  .act .body{font-size:clamp(14.5px,1.35vw,18px); color:var(--ink-2); line-height:1.5;}

  /* state panels (missing/holiday-drift data) */
  .note{max-width:56ch; margin:0;}
  .note h2{font-family:var(--f-display); font-size:clamp(17px,2vw,26px);
    margin:0 0 10px; letter-spacing:-.01em; color:var(--ink); text-wrap:balance;}
  .note p{font-size:clamp(13.5px,1.35vw,16.5px); color:var(--ink-2); margin:0 0 8px; line-height:1.55;}
  .note .fix{font-family:var(--f-body); font-size:13.5px; color:var(--ink-2);
    background:color-mix(in srgb,var(--safety) 12%,transparent);
    border-left:4px solid var(--safety); padding:11px 14px; border-radius:0 7px 7px 0; margin-top:12px;}
  .note .fix b{color:var(--safety)}

  /* ---- foot -------------------------------------------------------- */
  .foot{border-top:1.5px solid var(--line); padding:clamp(11px,1.6vh,16px) clamp(20px,3vw,40px);
    display:flex; gap:14px 26px; align-items:baseline; flex-wrap:wrap; flex:none;
    background:var(--panel-2);}
  .topic{font-size:clamp(12.5px,1.3vw,15px); color:var(--ink-2); font-weight:700;
    margin-right:auto; text-wrap:balance;}
  .topic span{display:block; font-family:var(--f-display); font-size:10.5px;
    letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:400; margin-bottom:3px;}

  /* ---- week strip -------------------------------------------------- */
  .strip{display:flex; gap:8px; flex-wrap:wrap; flex:none;}
  .chip{flex:1 1 0; min-width:96px; appearance:none; cursor:pointer; text-align:left;
    background:var(--panel); border:1.5px solid var(--line); border-radius:10px;
    padding:9px 11px 10px; transition:border-color .15s,transform .12s;
    display:flex; flex-direction:column; gap:4px;}
  .chip:hover{border-color:var(--cc,var(--accent)); transform:translateY(-1px)}
  .chip[aria-current="true"]{border-color:var(--cc,var(--accent)); border-width:2.5px;
    box-shadow:0 0 14px color-mix(in srgb,var(--cc,var(--accent)) 40%,transparent);}
  .chip .cd{font-family:var(--f-display); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-3); display:flex; justify-content:space-between;
    gap:8px; align-items:center;}
  .chip .cd b{font-family:var(--f-data); font-weight:400; letter-spacing:.02em;
    font-variant-numeric:tabular-nums;}
  .chip[aria-current="true"] .cd{color:var(--cc,var(--accent))}
  .chip .cn{font-size:12px; color:var(--ink-2); font-weight:600; line-height:1.3;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .chip.off{opacity:.4; cursor:default}
  .chip.off:hover{border-color:var(--line); transform:none}
  .chip .bar{height:3px; border-radius:2px; background:var(--cc,var(--none));}

  .legal{font-family:var(--f-data); font-size:11px; color:var(--ink-3);
    letter-spacing:.02em; text-align:center; padding-bottom:2px; line-height:1.6; flex:none;}

  /* ---- unified-board additions ------------------------------------- */
  /* static course tags in the rail (replaces the old course toggle) */
  .courses{display:flex; gap:8px; align-items:center;}
  .ctag{font-family:var(--f-display); font-weight:700; font-size:clamp(11px,1vw,13px);
    letter-spacing:.06em; text-transform:uppercase; color:var(--clc,var(--ink-2));
    border:1.5px solid color-mix(in srgb,var(--clc,var(--line)) 55%,var(--line));
    border-radius:8px; padding:7px 12px; background:color-mix(in srgb,var(--clc,var(--panel)) 12%,var(--panel));}
  /* per-course label above a differentiated bellringer / activity group */
  .clabel{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-display);
    font-size:clamp(11px,1.05vw,13px); letter-spacing:.14em; text-transform:uppercase;
    font-weight:700; margin-bottom:9px; color:var(--clc,var(--ink-2));}
  .clabel::before{content:""; width:13px; height:13px; border-radius:3px; flex:none;
    background:var(--clc,var(--ink-2)); box-shadow:0 0 10px var(--clc,var(--ink-2));}
  .actgroup + .actgroup{margin-top:15px;}
  /* the 3 reading questions */
  .qs{margin-top:13px; background:color-mix(in srgb,var(--vocab) 8%,var(--panel-2));
    border:1px solid color-mix(in srgb,var(--vocab) 35%,var(--line)); border-radius:10px;
    padding:13px 18px 14px;}
  .qs-h{font-family:var(--f-display); font-size:clamp(12px,1.15vw,14px); letter-spacing:.1em;
    text-transform:uppercase; color:var(--vocab); margin-bottom:9px;}
  .qs ol{margin:0; padding-left:1.4em; display:flex; flex-direction:column; gap:8px;}
  .qs li{font-size:clamp(15px,1.55vw,21px); line-height:1.4; color:var(--ink);}
  .qs-soon{margin-top:11px; font-size:clamp(12.5px,1.2vw,14px); color:var(--ink-3); font-style:italic;}
  /* Construction II differentiation note on the shared Friday activity */
  .diff{margin-top:11px; background:color-mix(in srgb,var(--courseII) 12%,transparent);
    border-left:4px solid var(--courseII); border-radius:0 7px 7px 0; padding:10px 14px;
    font-size:clamp(13.5px,1.3vw,16px); color:var(--ink-2); line-height:1.5;}
  .diff b{color:var(--courseII);}
  /* Monday weekly-overview list (compact names, no bloated cards) */
  .ovlist{margin:2px 0 0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px;}
  .ovlist li{font-size:clamp(14.5px,1.4vw,18px); color:var(--ink-2); line-height:1.35;}
  .ovlist li b{color:var(--ink); font-weight:700;}
  .ovfri{margin-left:8px; font-family:var(--f-display); font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--bg); background:var(--math); border-radius:5px; padding:1px 7px; font-weight:700;}
  .ovpts{margin-left:8px; font-family:var(--f-data); font-size:12px; color:var(--ink-3);}
  /* "where to find it" pointer under a daily activity */
  .reslink{margin-top:10px; font-family:var(--f-data); font-size:clamp(12px,1.2vw,14px); color:var(--ink-3);}
  .reslink a{color:var(--vocab); text-decoration:none;
    border-bottom:1px solid color-mix(in srgb,var(--vocab) 50%,transparent);}
  .reslink a:hover{color:var(--ink); border-bottom-color:var(--ink);}

  @media (max-width:720px){
    .prompt{max-width:none}
    .brand{width:100%; margin-bottom:2px}
    .date{width:100%; margin-bottom:2px; white-space:normal}
    body{overflow:auto}
    .wrap{height:auto; min-height:100vh}
  }
</style>

<div class="wrap">
  <div class="rail">
    <div class="brand"><span class="sq"></span>Daily Board</div>
    <div class="courses" aria-label="Courses shown on this board">
      <span class="ctag" style="--clc:var(--courseI)">Construction I</span>
      <span class="ctag" style="--clc:var(--courseII)">Construction II</span>
    </div>
    <div class="stepper">
      <button class="step" id="prev" aria-label="Previous school day">&#8592;</button>
      <button class="today" id="jumpToday">Today</button>
      <button class="step" id="next" aria-label="Next school day">&#8594;</button>
    </div>
    <select class="jump" id="wksel" aria-label="Jump to week"></select>
  </div>

  <main class="board">
    <div class="band" id="band"></div>
    <div class="head">
      <div class="day" id="day">&nbsp;</div>
      <div class="date" id="date"></div>
      <div class="wknum" id="wknum"></div>
    </div>
    <div class="sections" id="sections"></div>
    <div class="foot">
      <div class="topic" id="topic"></div>
    </div>
  </main>

  <div class="strip" id="strip"></div>
  <div class="legal" id="legal"></div>
</div>

ay, MLK Day", "prompts": {"MON": {"category": "SAFETY", "text": "Your crew is about to hand-raise a framed 8'x20' exterior wall. List FIVE things that must be checked or in place BEFORE the wall goes up — think crew count, footing and edge, temporary bracing, walking path, and the call-out. Then name the ONE person who calls the lift, and why it can only be one.", "authored": true}, "TUE": {"category": "VOCABULARY", "text": "Define: layout, cut, assemble, raise, plumb, brace, sheath. Put these 7 verbs in build order for a single wall."}, "WED": {"category": "TRADE MATH", "text": "A 30'-long wall has plates of 2x4 stock. Lumber comes in 8', 10', 12', 14', 16' lengths. What's the most efficient combination (least waste)?"}, "THU": {"category": "SCENARIO", "text": "The architect's plan calls for a built-up 2x12 header, but your supplier sent LVL. Write a 2-sentence RFI for direction."}, "FRI": {"category": "QUICK-DRAW / QUIZ PREP", "text": "Sketch a complete cut list page for an 8'x8' wall with one 36\" door. Columns: piece, qty, length, source dimension."}}, "reading": {"MON": {"text": "MLK DAY — NO SCHOOL."}, "TUE": {"text": "This week's slide deck — Section 5.3 'Wall Framing Sequence'. Reading Log: the 7-step sequence in order."}, "WED": {"text": "This week's slide deck — Section 5.4 'Wall Framing Materials'. Reading Log: 2x4 vs. 2x6 wall — when to use which."}, "THU": {"text": "This week's slide deck — Section 5.4 cont'd 'Headers & Beams'. Reading Log: built-up vs. LVL comparison."}, "FRI": {"text": "No new reading — review this week's material for the quiz.", "noReading": true}}, "activities": [{"title": "Wall Framing Sequence & Header Design", "points": "20 pts", "body": "(1) Sequence Sort write-up: arrange the 7 wall-framing steps (layout, cut, assemble, sheathe, raise, plumb, brace) in build order and explain why the order matters. (2) Header Design Worksheet: choose a header (built-up vs. LVL) for five openings and justify each choice; recommend 2x4 vs. 2x6 and sheathing type (OSB, CDX, ZIP) for six wall scenarios.", "friday": false}, {"title": "Quiz: Header & Rough Opening + Sheathing", "points": "20 pts", "body": "15-question quiz (Friday) on header sizing, rough openings, and sheathing types (OSB, CDX plywood, ZIP system).", "friday": false}, {"title": "Friday Hands-On: Cut List & Take-Off (shared with Construction II)", "points": "20 pts", "body": "Run jointly with the Construction II Friday activity. Generate a complete cut list and take-off for the 8'x8' wall built in Week 21 — lumber, fasteners, sheathing — with piece, qty, length, and source-dimension columns; compute total lumber cost at $0.85/LF for 2x4. SkillsUSA-style estimating. Graded on the 5-point rubric: Safety / Code Compliance / Accuracy / Craftsmanship / Cleanup. ---", "friday": true}]}, {"week": 21, "title": "Wall Framing: Tools & Safety", "sourceDates": "Speed Square, Framing Nailers", "prompts": {"MON": {"category": "SAFETY", "text": "A framing nailer at 120 psi can drive a nail through bone. Name 3 nailer-specific safety rules + the consequence of violating each."}, "TUE": {"category": "VOCABULARY", "text": "Define: framing hammer (vs. claw), pneumatic nailer, cordless nailer (battery + gas), sawzall. Why does a framing hammer have a waffle face?"}, "WED": {"category": "TRADE MATH", "text": "A pneumatic nailer at 110 psi drives a 3-1/4\" 12d gun nail in 0.5 seconds. Estimate how many nails per minute (continuous operation)."}, "THU": {"category": "SCENARIO", "text": "You're 8 feet up on a 6-ft stepladder reaching for a top-plate. The ladder wobbles. Write your 3-sentence response (descend or steady?)."}, "FRI": {"category": "QUICK-DRAW / QUIZ PREP", "text": "Sketch the entire wall framing nailing schedule for a stud-to-plate connection: which nails, how many, what spacing."}}, "reading": {"MON": {"text": "This week's slide deck — Section 5.5 'Speed Square & Layout'. Reading Log: 5 uses of a Speed Square."}, "TUE": {"text": "This week's slide deck ith Construction II)", "points": "20 pts", "body": "Run jointly with the Construction II Friday activity. Sheathe the 8'x8' wall flat with 1/2\" OSB, raise it with a 4-person team (foot blocks set, hard hats on), plumb with a 6-ft level to under 1/8\" total, brace temporarily, and pass grade inspection. Graded on the 5-point rubric: Safety / Code Compliance / Accuracy / Craftsmanship / Cleanup. ---", "friday": true}]}, {"week": 23, "title": "Roof Framing: Careers & Roof Anatomy", "sourceDates": "", "prompts": {"MON": {"category": "SAFETY", "text": "Roofing kills more carpenters per capita than any other framing trade. Name 3 roof-specific hazards + the OSHA-recommended control for each."}, "TUE": {"category": "VOCABULARY", "text": "Define: ridge, rafter, hip, valley, fascia, soffit, eave, gable end. Sketch a simple gable roof and label all 8."}, "WED": {"category": "TRADE MATH", "text": "Roof pitch 6/12: for a 14-ft run, what's the rise? What's the rafter length (Pythagorean)?"}, "THU": {"category": "SCENARIO", "text": "Your team is framing a 7/12 pitch roof. Snow forecast is heavy tomorrow. The lead wants to install plywood today and walk away. Write a 3-sentence response."}, "FRI": {"category": "QUICK-DRAW / QUIZ PREP", "text": "Sketch a hip-roof in plan view. Show: 4 hip rafters, 1 ridge, common rafters in each plane, hip jack rafters where applicable."}}, "reading": {"MON": {"text": "This week's slide deck — Section 6.1 'Roofer/Framer Career Specialization'. Reading Log: 3 roofing trades + wage."}, "TUE": {"text": "This week's slide deck — Section 6.2 'Roof Anatomy'. Reading Log: label 10 roof parts."}, "WED": {"text": "This week's slide deck — Section 6.2 cont'd 'Roof Styles'. Reading Log: 5 roof styles + pros/cons."}, "THU": {"text": "This week's slide deck — Section 6.2 cont'd 'Reading Roof Plans'. Reading Log: 5 roof-plan symbols."}, "FRI": {"text": "No new reading — review this week's material for the quiz.", "noReading": true}}, "activities": [{"title": "Roof Anatomy Sketch & Roof-Style Match-Up", "points": "20 pts", "body": "(1) Roof Anatomy Sketch: draw a hip-roof house in three views (plan, elevation, section) and label 12 parts. (2) Roof Style Match-Up: for eight building scenarios recommend a roof style (gable, hip, shed, mansard, gambrel) and justify; then answer 12 read-off questions on a residential roof framing plan (pitch, rafter size, sheathing spec).", "friday": false}, {"title": "Quiz: Roof Anatomy + Roof Style ID", "points": "20 pts", "body": "15-question quiz (Friday) on roof anatomy (ridge, rafters, hip, valley, fascia, soffit, eave, gable) and roof-style identification.", "friday": false}, {"title": "Friday Hands-On: Rafter Layout on Paper (shared with Construction II)", "points": "20 pts", "body": "Run jointly with the Construction II Friday activity. Lay out a common rafter at 4/12 pitch on chalk-lined plywood at full scale using a Speed Square; mark the plumb cut, bird's mouth, and tail. Graded on the 5-point rubric: Safety / Code Compliance / Accuracy / Craftsmanship / Cleanup. ---", "friday": true}]}, {"week": 24, "title": "Roof Framing: Sequence, Materials & Hurricane Ties", "sourceDates": "4-day", "prompts": {"MON": {"category": "", "text": "PRESIDENT'S DAY — NO SCHOOL.", "noSchool": true}, "TUE": {"category": "VOCABULARY", "text": "Define: ridge board, common rafter, ceiling joist, rafter tie, collar tie. Which two prevent the roof from spreading?"}, "WED": {"category": "TRADE MATH", "text": "Roof sheathing for a 24'x40' gable roof at 5/12 pitch: rafter length = 12.49'. How many 4'x8' OSB sheets per side? Total?"}, "THU": {"category": "SCENARIO", "text": "Hurricane ties weren't installed on yesterday's rafters per the engineer's note. Architect on site. Write a 2-sentence RFI."}, "FRI": {"category": "QUICK-DRAW / QUIZ PREP", "text": "Sketch a Simpson H2.5 hurricane tie on a rafter-to-wall-plate connection. Show all 5 nail locations."}}, "reading": {"MON": {"text": "PRESIDENT'S DAY — NO SCHOOL."}, "TUE": {"text": "This week's slide deck — Section 6.3 'Roof Framing Sequence'. Reading Log: the 6-step roof framing sequence."}, "WED": {"text": "This week's slide deck — Section 6.4 'Roof Framing Materials'. Reading Log: 2x6 vs. 2x8 vs. 2x10 rafter span comparison."}, "THU": {"text": "This week's slide deck — Section 6.4 cont'd 'Hurricane Ties & Connectors'. Reading Log: H1, H2.5, LSTA connectors."}, "FRI": {"text": "No new reading — review this week's material for the quiz.", "noReading": true}}, "activities": [{"title": "Rafter Span Sizing & Connector Match-Up", "points": "20 pts", "body": "(1) Rafter Span Worksheet: size rafters for six given spans and pitches using the CRC R802 span tables. (2) Connector Match-Up: match 10 structural connections to the correct Simpson Strong-Tie product (H1, H2.5, H10A, LSTA, CS strap) and nailing schedule.", "friday": false}, {"title": "Quiz: Roof Materials + Hurricane Tie ID", "points": "20 pts", "body": "12-question quiz (Friday) on rafter and ridge-board materials and hurricane-tie/connector identification.", "friday": false}, {"title": "Friday Hands-On: Cut a Pair of Common Rafters (shared with Construction II)", "points": "20 pts", "body": "Run jointly with the Construction II Friday activity. Cut two matching common rafters from 2x6 stock at 6/12 pitch with a 12\" tail; test-fit against a mock ridge and wall plates; the pair must match within 1/8\". Graded on the 5-point rubric: Safety / Code Compliance / Accuracy / Craftsmanship / Cleanup. ---", "friday": true}]}, {"week": 25, "title": "Roof Framing: Tools & Roof Safety", "sourceDates": "", "prompts": {"MON": {"category": "SAFETY", "text": "Working on a sloped roof: list 3 personal fall-arrest equipment items + their function. When is a roof harness required?"}, "TUE": {"category": "VOCABULARY", "text": "Define: plumb cut, seat cut, bird's mouth, tail cut, ridge plumb cut. Sketch a rafter showing all 5 cuts."}, "WED": {"category": "TRADE MATH", "text": "A 7/12 pitc : Safety / Code Compliance / Accuracy / Craftsmanship / Cleanup. ---", "friday": true}]}, {"week": 28, "title": "Exterior Envelope: Sequence, Roofing & Siding Materials", "sourceDates": "", "prompts": {"MON": {"category": "SAFETY", "text": "Roofing materials are heavy. A bundle of asphalt shingles weighs ~75 lbs. Name 3 ergonomic strategies for moving bundles up to the roof."}, "TUE": {"category": "VOCABULARY", "text": "Define: 3-tab shingle, architectural shingle, ridge cap, starter strip, drip edge. Which one goes on first?"}, "WED": {"category": "TRADE MATH", "text": "A roof has 22 squares (1 square = 100 sq ft). Architectural shingles cover 33 sq ft per bundle + 3 bundles per square. How many bundles?"}, "THU": {"category": "SCENARIO", "text": "Your siding contractor uses galvanized fasteners on fiber-cement. The manufacturer requires stainless steel. Write a 3-sentence RFI to the GC."}, "FRI": {"category": "QUICK-DRAW / QUIZ PREP", "text": "Sketch a 4'x4' roof mock-up showing: drip edge, starter strip, first course of shingles, exposure (5\" typical), fastener locations."}}, "reading": {"MON": {"text": "This week's slide deck — Section 7.3 'Exterior Sequence'. Reading Log: the 7 steps of exterior install in order."}, "TUE": {"text": "This week's slide deck — Section 7.4 'Roofing Materials'. Reading Log: 4 shingle types + lifespan."}, "WED": {"text": "This week's slide deck — Section 7.4 cont'd 'Siding Materials'. Reading Log: 4 siding types + cost."}, "THU": {"text": "This week's slide deck — Section 7.4 cont'd 'Exterior Fasteners & Flashing'. Reading Log: 4 exterior fastener types + corrosion resistance."}, "FRI": {"text": "No new reading — review this week's material for the quiz.", "noReading": true}}, "activities": [{"title": "Roofing & Siding Material Comparisons", "points": "20 pts", "body": "(1) Roofing Material Comparison: build a cost/lifespan/wind-rating chart for five roofing types and recommend one for three client budgets. (2) Siding + Fastener Sel ng, HVAC, framing."}}, "reading": {"MON": {"text": "This week's slide deck — Section 1.1 'What is the Construction Industry?'. Reading Log: 3 facts + 1 question.", "questions": ["What are the main sectors of the construction industry, and which sector does residential construction belong to?", "Name three ways the construction industry contributes to the local and national economy.", "What is the difference between residential, commercial, and civil/infrastructure construction? Give one example of each."]}, "TUE": {"text": "This week's slide deck — Section 1.1 cont'd 'Careers in Residential Construction'. Reading Log: 5 careers + CA 2026 median wage.", "questions": ["List five careers in residential construction and the primary task of each.", "Which of these careers typically require an apprenticeship, and about how long does an apprenticeship take?", "Pick one career from the slides and state its California 2026 median wage and one skill it demands."]}, "WED": {"text": "This week's slide deck — Section 1.2 'Construction Fundamentals'. Reading Log: define load, dead load, live load, span, on-center.", "questions": ["Define 'load,' then explain the difference between a dead load and a live load with one example of each.", "What does 'span' mean, and how does a longer span affect the size of the framing members needed?", "What does 'on-center (o.c.)' spacing mean, and why is 16\" o.c. so common in framing?"]}, "THU": {"text": "This week's slide deck — Section 1.5 'Hand Tools'. Reading Log: name 10 hand tools + one purpose each.", "questions": ["Name ten common hand tools used in residential construction and state one purpose for each.", "Sort at least six of those tools into 'measuring/marking' vs. 'cutting/driving.'", "Choose one hand tool and describe one safety rule for using it correctly."]}, "FRI": {"text": "No new reading — review this week's material for the quiz.", "noReading": true}}, "activities": [{"title": "LOTO & Hot-Work Permit Labs", "points": "20 pts" s-On: Estimating Sprint (shared with Construction I)", "points": "20 pts", "body": "Each team completes a full quantity take-off on the same 12'x16' shed plan in 30 minutes; accuracy within +/-5% of the teacher key earns the leaderboard, and the top 3 teams win industry-donated scale rulers. Done jointly with the Construction I Friday activity and graded on the 5-point rubric: Safety / Code Compliance / Accuracy / Craftsmanship / Cleanup. ---", "friday": true}]}, {"week": 5, "title": "Module 2 cont'd: Labor Hours, Productivity Rates & Unit Pricing | Module 2 Test", "sourceDates": "Sep 8–11, 4-day — Labor Day Mon Sep 7", "prompts": {"MON": {"category": "", "text": "LABOR DAY — NO SCHOOL (Monday).", "noSchool": true}, "TUE": {"category": "Vocabulary", "text": "Define: (a) Productivity rate (b) Crew size (c) Direct cost (d) Burden. Which is hardest to estimate, and why?"}, "WED": {"category": "Trade Math", "text": "A framing crew earns $42/hr each (2 framers). Sheathing takes 6 labor-hours. What's direct labor cost for sheathing? Add 35% burden — fully loaded labor cost?"}, "THU": {"category": "Scenario/RFI", "text": "A homeowner asks why your bid is $14,200 when the next bid is $11,500. Write a 4-sentence professional response that doesn't lower the price but explains the value."}, "FRI": {"category": "Quick-Draw/Quiz Prep", "text": "Sketch a 1-page bid summary form: project name, scope statement, takeoff totals (rows), unit costs, overhead %, profit %, bid total."}}, "reading": {"MON": {"text": "No school — Labor Day holiday."}, "TUE": {"text": "This week's slide deck — Section 2.1 'Site Industry & Careers'. Reading Log: 3 site-prep careers + median wage."}, "WED": {"text": "This week's slide deck — Section 2.2 'Site Analysis & Soil Types'. Reading Log: list 4 soil types (sand, silt, clay, loam) + drainage rating."}, "THU": {"text": "OSHA-10 Module 2 reading packet 'Fall Protection'. Reading Log: define 6-ft rule, anchor point, lanyard."}, "FRI": {"text": "No new rea var DAYS = DATA.days;                       // MON..FRI
var LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
var MON  = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONL = ["January","February","March","April","May","June","July",
            "August","September","October","November","December"];

/* Five categories of the Mon-Fri bellringer rotation, each with its own neon colour. */
var CATS = [
  {key:"safety",  label:"Safety",     v:"--safety"},
  {key:"vocab",   label:"Vocabulary", v:"--vocab"},
  {key:"math",    label:"Trade Math", v:"--math"},
  {key:"scenario",label:"Scenario",   v:"--scenario"},
  {key:"draw",    label:"Quick-Draw", v:"--draw"}
];
function catOf(raw, dayIdx){
  var s = (raw||"").toLowerCase();
  if(s.indexOf("safety")>-1)   return CATS[0];
  if(s.indexOf("vocab")>-1)    return CATS[1];
  if(s.indexOf("math")>-1)     return CATS[2];
  if(s.indexOf("scenario")>-1) return CATS[3];
  if(s.indexOf("draw")>-1||s.indexOf("quiz")>-1) return CATS[4];
  return CATS[dayIdx] || CATS[0];           // blank -> fall back to the rotation
}
/* Con II writes "Scenario/RFI"; keep the source's own wording on screen. */
function catLabel(raw, c){
  if(!raw) return c.label;
  var t = raw.replace(/\s*\/\s*/g," / ").trim();
  if(t === t.toUpperCase()) t = t.toLowerCase().replace(/(^|[\s\/\-])([a-z])/g,
      function(_,p,ch){return p+ch.toUpperCase();}).replace(/Rfi/g,"RFI");
  return t;
}

/* ---- calendar: flatten the instructional weeks into real school days ---- */
var SCHOOL = [];                             // {iso,d,wk,di}
DATA.weeks.forEach(function(week, wi){
  week.forEach(function(iso){
    var p = iso.split("-");
    var dt = new Date(+p[0], +p[1]-1, +p[2]);
    SCHOOL.push({iso:iso, d:dt, wk:wi, di:dt.getDay()-1});
  });
});
var cursor = 0;

function weekOfCourse(c, wi){ var w = DATA.courses[c]; return wi < w.length ? w[wi] : null; }
function fmtLong(d){ return LONG[d.getDay()-1] + ", " + MONL[d.getMonth()] + " " +
                            d.getDate() + ", " + d.getFullYear(); }
function fmtShort(d){ return MON[d.getMonth()] + " " + d.getDate(); }

/* Pick the day to open on: today if it's a school day, else the next one. */
function resolveToday(){
  var n = new Date(); n.setHours(0,0,0,0);
  for(var i=0;i<SCHOOL.length;i++){ if(SCHOOL[i].d >= n) return {i:i, exact:+SCHOOL[i].d === +n}; }
  return {i:SCHOOL.length-1, exact:false};
}
var TODAY = resolveToday();

function setAccent(v){ document.documentElement.style.setProperty("--accent","var("+v+")"); }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }

function note(h, ps, fix){
  var d = document.createElement("div"); d.className = "note";
  var t = document.createElement("h2"); t.textContent = h; d.appendChild(t);
  ps.forEach(function(x){ var q=document.createElement("p"); q.textContent=x; d.appendChild(q); });
  if(fix){ var f=document.createElement("div"); f.className="fix";
           f.innerHTML = "<b>Fix</b> &nbsp;" + esc(fix); d.appendChild(f); }
  return d;
}

function sectionEl(){ var s = document.createElement("div"); s.className = "sec"; return s; }
function tagEl(label, colorVar, meta){
  var t = document.createElement("div"); t.className = "tag";
  if(colorVar) t.style.setProperty("--tagc","var("+colorVar+")");
  t.textContent = label;
  if(meta){ var m = document.createElement("span"); m.className="meta"; m.textContent=" · "+meta; t.appendChild(m); }
  return t;
}

/* per-course label chip used above the two bellringers and activity groups */
function courseLabel(text, colorVar){
  var d = document.createElement("div"); d.className = "clabel";
  d.style.setProperty("--clc","var("+colorVar+")"); d.textContent = text; return d;
}

/* ---- differentiated bellringer (rendered once per course) ------------ */
function renderBellringer(wk, s, clabelText, clabelVar){
  var sec = sectionEl();
  sec.appendChild(courseLabel(clabelText, clabelVar));
  var dayKey = DAYS[s.di];
  var p = wk ? wk.prompts[dayKey] : null;

  if(p && p.noSchool){
    sec.appendChild(tagEl("Bellringer","--safety"));
    sec.appendChild(note("This prompt needs replacing",
      ["The source file marks " + LONG[s.di] + " of Week " + wk.week + " as a holiday — "+
       "it was written against a calendar that ran one week later.",
       "On the verified PUSD calendar this is a normal school day, so there is no bellringer written for it yet."],
      "Source text: “" + p.text + "”"));
    return sec;
  }
  if(!p){
    sec.appendChild(tagEl("Bellringer","--none"));
    sec.appendChild(note("No bellringer for this day",
      ["Week " + (wk ? wk.week : "?") + " has no " + LONG[s.di] + " bellringer in the source file."], null));
    return sec;
  }
  var c = catOf(p.category, s.di);
  sec.appendChild(tagEl("Bellringer — " + catLabel(p.category,c), c.v, "5 min · silent · written"));
  var pr = document.createElement("p");
  pr.className = "prompt" + (p.text.length > 190 ? " small" : "");
  pr.textContent = p.text;
  sec.appendChild(pr);
  return sec;
}

/* ---- section 2: daily slide reading ----------------------------------- */
/* Same slot as the old textbook Reading Assignment, but the source is this
   week's assembled GW slide deck (projected / posted to Course Resources)
   rather than a G-W / Paxton-Patterson login students don't have yet. */
function renderReading(wk, s){
  var sec = sectionEl();
  var dayKey = DAYS[s.di];
  var r = wk.reading ? wk.reading[dayKey] : null;
  sec.appendChild(tagEl("Daily Slide Reading", "--vocab", "~20 min · read from the slides · reading log"));
  if(!r){
    sec.appendChild(note("No slide reading listed", ["Week " + wk.week + " has no " + LONG[s.di] + " slide reading entry in the source file."], null));
    return sec;
  }
  var pr = document.createElement("p");
  pr.className = "prompt reading";
  pr.textContent = r.text;
  sec.appendChild(pr);

  /* 3 comprehension questions drawn from the day's slides (staged by chapter). */
  if(r.questions && r.questions.length){
    var box = document.createElement("div"); box.className = "qs";
    var hh = document.createElement("div"); hh.className = "qs-h";
    hh.textContent = "3 Questions — answer from today's slides";
    box.appendChild(hh);
    var ol = document.createElement("ol");
    r.questions.forEach(function(q){ var li = document.createElement("li"); li.textContent = q; ol.appendChild(li); });
    box.appendChild(ol);
    sec.appendChild(box);
  } else if(!r.noReading){
    var soon = document.createElement("div"); soon.className = "qs-soon";
    soon.textContent = "3 questions for this reading are being written (Chapter 1 ready; chapters 2–9 in progress).";
    sec.appendChild(soon);
  }
  return sec;
}

/* ---- activities: Mon = weekly overview, Tue-Thu = one daily activity per
   course, Fri = the shared hands-on. Keeps each day to a single item per class
   instead of repeating the whole week every day. --------------------------- */
function actBox(a, isToday){
  var box = document.createElement("div");
  box.className = "act" + (a.friday ? " friday" : "");
  var h = document.createElement("div"); h.className = "h";
  var b = document.createElement("b"); b.textContent = a.title; h.appendChild(b);
  if(a.friday){
    var badge = document.createElement("span"); badge.className = "fribadge";
    badge.textContent = isToday ? "Today · Fri" : "Fri";
    h.appendChild(badge);
  }
  if(a.points){ var pts = document.createElement("span"); pts.className="pts"; pts.textContent = a.points; h.appendChild(pts); }
  box.appendChild(h);
  if(a.body){ var body = document.createElement("div"); body.className="body"; body.textContent = a.body; box.appendChild(body); }
  return box;
}
/* the single Friday hands-on (first friday-flagged item; build() guarantees <=1) */
function fridayOf(wk){
  var list = (wk && wk.activities) || [];
  for(var i=0;i<list.length;i++) if(list[i].friday) return list[i];
  return null;
}
/* "where to get it" line: a real link if we have one, else a Classroom pointer */
function resourceLine(course, wknum, item){
  var wrap = document.createElement("div"); wrap.className = "reslink";
  /* only http(s) links become clickable; anything else falls back to the
     pointer so a bad paste (javascript:/data:) can't ship to the board. */
  if(item.link && /^https?:\/\//i.test(item.link)){
    var a = document.createElement("a"); a.href = item.link;
    a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open in Google Classroom →";
    wrap.appendChild(a);
  } else {
    wrap.textContent = "Find it: Google Classroom → Construction " + course + " → Classwork · Week " + wknum;
  }
  return wrap;
}
/* Monday: compact named roadmap of the week's major activities */
function overviewGroup(sec, labelText, colorVar, wk){
  var list = (wk && wk.activities) || [];
  if(!list.length) return;
  var g = document.createElement("div"); g.className = "actgroup";
  g.appendChild(courseLabel(labelText, colorVar));
  var ul = document.createElement("ul"); ul.className = "ovlist";
  list.forEach(function(a){
    var li = document.createElement("li");
    var b = document.createElement("b"); b.textContent = a.title; li.appendChild(b);
    if(a.friday){ var f = document.createElement("span"); f.className = "ovfri"; f.textContent = "Fri"; li.appendChild(f); }
    if(a.points){ var p = document.createElement("span"); p.className = "ovpts"; p.textContent = a.points; li.appendChild(p); }
    ul.appendChild(li);
  });
  g.appendChild(ul); sec.appendChild(g);
}
/* Tue/Wed/Thu: the one authored activity for this course + a resource pointer */
function dailyGroup(sec, labelText, colorVar, course, wknum, dayKey){
  var g = document.createElement("div"); g.className = "actgroup";
  g.appendChild(courseLabel(labelText, colorVar));
  var da = DATA.day_activities && DATA.day_activities[course] && DATA.day_activities[course][String(wknum)];
  var item = da && da[dayKey];
  if(!item){
    var soon = document.createElement("div"); soon.className = "qs-soon";
    soon.textContent = "Today's activity is being written (Chapter 1 ready; chapters 2–9 in progress).";
    g.appendChild(soon); sec.appendChild(g); return;
  }
  var box = document.createElement("div"); box.className = "act";
  var h = document.createElement("div"); h.className = "h";
  var b = document.createElement("b"); b.textContent = item.title; h.appendChild(b);
  if(item.points){ var pts = document.createElement("span"); pts.className = "pts"; pts.textContent = item.points; h.appendChild(pts); }
  box.appendChild(h);
  if(item.doc){ var d = document.createElement("div"); d.className = "body"; d.textContent = item.doc; box.appendChild(d); }
  box.appendChild(resourceLine(course, wknum, item));
  g.appendChild(box); sec.appendChild(g);
}
function renderActivities(wkI, wkII, s){
  var sec = sectionEl();
  var wknum = (wkI || wkII).week;

  if(s.di === 0){                                   /* Monday: weekly overview */
    sec.appendChild(tagEl("This Week's Activities · Overview", "--draw", "details posted each day"));
    overviewGroup(sec, "Construction I",  "--courseI",  wkI);
    overviewGroup(sec, "Construction II", "--courseII", wkII);
    return sec;
  }

  if(s.di === 4){                                   /* Friday: shared hands-on */
    sec.appendChild(tagEl("Friday Hands-On · Shared", "--math"));
    var fri = fridayOf(wkI) || fridayOf(wkII);
    if(!fri){ sec.appendChild(note("No Friday activity listed", ["Week " + wknum + " has no Friday hands-on in the source file."], null)); return sec; }
    var wrap = document.createElement("div"); wrap.className = "activities";
    var box = actBox(fri, true);
    var diffText = DATA.conII_friday_diff ? DATA.conII_friday_diff[String(wknum)] : null;
    if(diffText){
      var diff = document.createElement("div"); diff.className = "diff";
      var lab = document.createElement("b"); lab.textContent = "Construction II — added challenge: ";
      diff.appendChild(lab); diff.appendChild(document.createTextNode(diffText));
      box.appendChild(diff);
    }
    wrap.appendChild(box); sec.appendChild(wrap);
    return sec;
  }

  /* Tue/Wed/Thu: one activity per course */
  sec.appendChild(tagEl("Today's Activity", "--draw", "1 per class · self-grading"));
  dailyGroup(sec, "Construction I",  "--courseI",  "I",  wknum, DAYS[s.di]);
  dailyGroup(sec, "Construction II", "--courseII", "II", wknum, DAYS[s.di]);
  return sec;
}

function render(){
  var s = SCHOOL[cursor];
  var wkI = weekOfCourse("I", s.wk), wkII = weekOfCourse("II", s.wk);

  el("day").textContent  = LONG[s.di];
  el("date").textContent = fmtLong(s.d);
  el("prev").disabled = cursor === 0;
  el("next").disabled = cursor === SCHOOL.length-1;
  el("wksel").value = s.wk;

  var sections = el("sections");
  sections.innerHTML = "";

  if(!wkI && !wkII){
    /* Real school days past the end of the 36-week curriculum. */
    setAccent("--none");
    el("wknum").textContent = "No week assigned";
    var sec = sectionEl();
    sec.appendChild(note("Past the 36-week plan",
      ["The curriculum runs 36 weeks. This is a real school week on the PUSD calendar, "+
       "but no bellringer/reading/activity set was written for it.",
       "Finals, the capstone showcase, and check-out usually land here."],
      "Write a set for this week, or stretch Week 36 across it."));
    sections.appendChild(sec);
    el("topic").innerHTML = "<span>Week topic</span>Unassigned";
    drawStrip();
    return;
  }

  /* The band stays the reading colour: on a combined board the shared Daily
     Slide Reading is the anchor, not either course's bellringer category. */
  setAccent("--vocab");
  var wk = wkI || wkII;
  el("wknum").textContent = "Week " + wk.week;
  var topics = "";
  if(wkI)  topics += "<b style=\"color:var(--courseI)\">I</b>&nbsp; "  + esc(wkI.title);
  if(wkI && wkII) topics += " &nbsp;·&nbsp; ";
  if(wkII) topics += "<b style=\"color:var(--courseII)\">II</b>&nbsp; " + esc(wkII.title);
  el("topic").innerHTML = "<span>Week " + wk.week + " topic</span>" + topics;

  /* bellringers FIRST -- the do-now is the first thing we do in class -- then
     the shared slide reading + questions, then activities (per-course weekdays
     + shared Friday). */
  if(wkI)  sections.appendChild(renderBellringer(wkI,  s, "Construction I",  "--courseI"));
  if(wkII) sections.appendChild(renderBellringer(wkII, s, "Construction II", "--courseII"));
  sections.appendChild(renderReading(wkI || wkII, s));
  sections.appendChild(renderActivities(wkI, wkII, s));

  drawStrip();
}

/* The week's five days, so students/teacher can see what is coming and jump. */
function drawStrip(){
  var s = SCHOOL[cursor], week = DATA.weeks[s.wk], wk = weekOfCourse("I", s.wk);
  var strip = el("strip"); strip.innerHTML = "";
  var have = {};
  week.forEach(function(iso){ var p=iso.split("-");
    have[new Date(+p[0],+p[1]-1,+p[2]).getDay()-1] = iso; });

  for(var i=0;i<5;i++){
    var iso = have[i];
    var b = document.createElement("button");
    b.className = "chip" + (iso ? "" : " off");
    var pr = wk ? wk.prompts[DAYS[i]] : null;
    var c  = pr && !pr.noSchool ? catOf(pr.category,i) : null;
    b.style.setProperty("--cc", c ? "var("+c.v+")" : "var(--none)");
    var dt = iso ? new Date(+iso.split("-")[0],+iso.split("-")[1]-1,+iso.split("-")[2]) : null;

    var bar = document.createElement("div"); bar.className="bar"; b.appendChild(bar);
    var cd = document.createElement("div"); cd.className="cd";
    cd.innerHTML = "<span>"+DAYS[i]+"</span><b>"+(dt?fmtShort(dt):"no school")+"</b>";
    b.appendChild(cd);
    var cn = document.createElement("div"); cn.className="cn";
    cn.textContent = !iso ? "—" : (pr && !pr.noSchool ? catLabel(pr.category,c) : "Needs a prompt");
    b.appendChild(cn);

    if(iso){
      b.setAttribute("aria-current", iso === s.iso ? "true" : "false");
      (function(target){ b.onclick = function(){ go(indexOf(target)); }; })(iso);
    }
    strip.appendChild(b);
  }
}
function indexOf(iso){ for(var i=0;i<SCHOOL.length;i++) if(SCHOOL[i].iso===iso) return i; return cursor; }
function go(i){ cursor = Math.max(0, Math.min(SCHOOL.length-1, i)); render(); }

/* ---- controls -------------------------------------------------------- */
el("prev").onclick = function(){ go(cursor-1); };
el("next").onclick = function(){ go(cursor+1); };
el("jumpToday").onclick = function(){ go(TODAY.i); };
document.addEventListener("keydown", function(e){
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowLeft"){ e.preventDefault(); go(cursor-1); }
  if(e.key === "ArrowRight"){ e.preventDefault(); go(cursor+1); }
});

(function buildJump(){
  var sel = el("wksel");
  DATA.weeks.forEach(function(week, wi){
    var a = week[0].split("-"), b = week[week.length-1].split("-");
    var d1 = new Date(+a[0],+a[1]-1,+a[2]), d2 = new Date(+b[0],+b[1]-1,+b[2]);
    var o = document.createElement("option");
    o.value = wi;
    o.textContent = (wi < 36 ? "Week " + (wi+1) : "Unassigned") +
                    "  ·  " + fmtShort(d1) + "–" + fmtShort(d2);
    sel.appendChild(o);
  });
  sel.onchange = function(){ go(indexOf(DATA.weeks[+sel.value][0])); };
})();

/* Footer states the mapping plainly so nobody has to guess where dates come from. */
(function legal(){
  var t = new Date();
  var first = SCHOOL[0], last = SCHOOL[SCHOOL.length-1];
  el("legal").innerHTML =
    "Curriculum weeks 1–36 mapped in order onto the verified PUSD 2026–27 calendar " +
    "(180 student days, " + fmtShort(first.d) + " " + first.d.getFullYear() + " – " +
    fmtShort(last.d) + " " + last.d.getFullYear() + ").<br>" +
    "One combined board for both courses. Bellringer and activity text are verbatim from the Construction I &amp; II weekly assignment files; the shared Daily Slide Reading points to this year's assembled G-W slide decks (same full-year map for both courses) while G-W and Paxton-Patterson student logins are pending, and its 3 questions are teacher-authored (no G-W content reproduced). " +
    (TODAY.exact ? "Showing today." :
      "Today is " + fmtShort(t) + " " + t.getFullYear() + " — opening on the next school day.");
})();

go(TODAY.i);
</script>
